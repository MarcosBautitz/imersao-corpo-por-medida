<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Página C no computador</title>
<style>
/* Previa do computador: moldura de janela de 1440 x 900 que carrega pagina-c.html.
   A tela de dentro e sempre 1440 x 900; a moldura so encolhe na tela de fora para caber. */
:root { --container: 100%; --gutter: 16px; }
@media (min-width: 768px)  { :root { --container: 100%;   --gutter: 24px; } }
@media (min-width: 1024px) { :root { --container: 100%;   --gutter: 32px; } }
@media (min-width: 1280px) { :root { --container: 1200px; --gutter: 32px; } }
@media (min-width: 1440px) { :root { --container: 1340px; --gutter: 40px; } }
@media (min-width: 1920px) { :root { --container: 1440px; --gutter: 48px; } }
@media (min-width: 2560px) { :root { --container: 1600px; --gutter: 48px; } }
@media (min-width: 3440px) { :root { --container: 1800px; --gutter: 64px; } }
@media (min-width: 3840px) { :root { --container: 2000px; --gutter: 80px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; margin: 0; }
body { min-height: 100vh; background: #e2e2e2; }
.palco {
  width: 100%;
  padding: 24px 16px;
  display: flex;
  justify-content: center;
}
.caixa { position: relative; width: 1442px; height: 938px; }
.moldura {
  position: absolute;
  top: 0;
  left: 0;
  width: 1442px;
  height: 938px;
  border: 1px solid #1b1b1b;
  border-radius: 12px;
  background: #1b1b1b;
  overflow: hidden;
  transform-origin: 0 0;
}
.barra {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
}
.barra span { width: 12px; height: 12px; border-radius: 50%; background: #5a5a5a; }
.moldura iframe {
  display: block;
  width: 1440px;
  height: 900px;
  border: 0;
  background: #ffffff;
}
</style>
</head>
<body>
<div class="palco">
  <div class="caixa" id="caixa">
    <div class="moldura" id="moldura">
      <div class="barra" aria-hidden="true"><span></span><span></span><span></span></div>
      <iframe src="../pagina-c.html" width="1440" height="900" title="Página C, tela de computador de 1440 por 900"></iframe>
    </div>
  </div>
</div>
<script>
(function () {
  var caixa = document.getElementById('caixa');
  var moldura = document.getElementById('moldura');
  function ajusta() {
    var largura = document.documentElement.clientWidth - 32;
    var altura = window.innerHeight - 48;
    var escala = Math.max(0.2, Math.min(1, largura / 1442, altura / 938));
    moldura.style.transform = 'scale(' + escala + ')';
    caixa.style.width = (1442 * escala) + 'px';
    caixa.style.height = (938 * escala) + 'px';
  }
  ajusta();
  window.addEventListener('resize', ajusta);
})();
</script>
</body>
</html>
